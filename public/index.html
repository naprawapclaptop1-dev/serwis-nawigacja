<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVI PRO</title><meta name="theme-color" content="#07101d"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SERVICE={lat:52.29073,lon:20.94883,name:'Marymoncka 125/109, Warszawa'};const map=L.map('map').setView([SERVICE.lat,SERVICE.lon],15);L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);L.marker([SERVICE.lat,SERVICE.lon]).addTo(map).bindPopup('<b>NAVI PRO</b><br>'+SERVICE.name);let user;function gps(){navigator.geolocation?.watchPosition(p=>{const q=[p.coords.latitude,p.coords.longitude];if(!user)user=L.circleMarker(q,{radius:8}).addTo(map);else user.setLatLng(q)},e=>console.warn(e),{enableHighAccuracy:true,maximumAge:1000,timeout:12000})}gps();</script></body></html>
