name: Deploy NAVI PRO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz kod NAVI PRO
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sprawdź konfigurację Cloudflare
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are missing."
          fi

      - name: Deploy do Cloudflare
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Podsumowanie pominiętego wdrożenia
        if: steps.cloudflare.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "## NAVI PRO: wdrożenie pominięte"
            echo ""
            echo "Workflow zakończył się bez błędu, ale portal nie został wdrożony."
            echo "Dodaj sekrety CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID w Settings → Secrets and variables → Actions."
          } >> "$GITHUB_STEP_SUMMARY"
