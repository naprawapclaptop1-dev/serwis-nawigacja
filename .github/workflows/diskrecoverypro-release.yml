name: Disk Recovery PRO release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-diskrecoverypro:
    runs-on: ubuntu-latest
    steps:
      - name: Download update package from public OneDrive share API
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.onedrive.com/v1.0/shares/u!aHR0cHM6Ly9zZXJ3aXMxOTg4LW15LnNoYXJlcG9pbnQuY29tLzp1Oi9nL3BlcnNvbmFsL25hcHJhd2FwY2xhcHRvcF9zZXJ3aXMxOTg4X29ubWljcm9zb2Z0X2NvbS9JUUJUWC1jcm9jRFhRcUVQZU1GQzQzeUxBUkpMa2Q4ZlFvSTF6Sjl4aGxSdDM4OA/root/content'
          curl -L --retry 5 --retry-all-errors --retry-delay 3 --fail --user-agent 'DiskRecoveryPRO-ReleaseBot/1.0' "$url" -o DiskRecoveryPRO_Update.zip
          test -s DiskRecoveryPRO_Update.zip
          unzip -t DiskRecoveryPRO_Update.zip >/dev/null

      - name: Publish GitHub release v1.4.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.8 >/dev/null 2>&1; then
            echo 'Release v1.4.8 already exists.'
          else
            gh release create v1.4.8 DiskRecoveryPRO_Update.zip \
              --title 'Disk Recovery PRO v1.4.8' \
              --notes 'Automatyczna aktualizacja Disk Recovery PRO. Paczka testowa 1.4.8.' \
              --latest
          fi

      - name: Show release URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.4.8 --json url -q .url
