name: Disk Recovery PRO release manifest

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-diskrecoverypro-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and verify release update package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "DiskRecoveryPRO_Update.zip" --dir artifacts
          test -s artifacts/DiskRecoveryPRO_Update.zip
          unzip -t artifacts/DiskRecoveryPRO_Update.zip >/dev/null
          SHA256="$(sha256sum artifacts/DiskRecoveryPRO_Update.zip | awk '{print $1}')"
          echo "$SHA256  DiskRecoveryPRO_Update.zip" > artifacts/DiskRecoveryPRO_Update.sha256.txt
          echo "$SHA256" > artifacts/sha256.txt

      - name: Update the stable channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(cat artifacts/sha256.txt)"
          DOWNLOAD_URL="https://github.com/$REPOSITORY/releases/download/$TAG/DiskRecoveryPRO_Update.zip"
          python3 - <<'PY'
          import json, os
          payload = {
              "version": os.environ["VERSION"],
              "channel": "stable",
              "release_notes": f"Disk Recovery PRO v{os.environ['VERSION']}",
              "downloadUrl": os.environ["DOWNLOAD_URL"],
              "sha256": os.environ["SHA256"],
          }
          with open("latest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          if gh api "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" > current.json 2>/dev/null; then
            CURRENT_SHA="$(python3 -c "import json; print(json.load(open('current.json', encoding='utf-8'))['sha'])")"
            B64="$(base64 -w0 latest.json)"
            gh api --method PUT "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" \
              -f message="Publish Disk Recovery PRO v$VERSION update manifest" \
              -f content="$B64" -f sha="$CURRENT_SHA" -f branch="main" >/dev/null
          else
            B64="$(base64 -w0 latest.json)"
            gh api --method PUT "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" \
              -f message="Publish Disk Recovery PRO v$VERSION update manifest" \
              -f content="$B64" -f branch="main" >/dev/null
          fi
          echo "Published latest.json for Disk Recovery PRO v$VERSION"
