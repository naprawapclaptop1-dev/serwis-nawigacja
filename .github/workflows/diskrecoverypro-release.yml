name: Disk Recovery PRO release manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania, np. v1.6.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-diskrecoverypro-manifest:
    # Migration prereleases are uploaded by the local publisher. Skip this job for them to avoid a race before installer upload completes.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease != true
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          PRERELEASE="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)"
          if [[ "$PRERELEASE" != "true" ]]; then PRERELEASE=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download and verify standard installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "DiskRecoveryPRO_Setup.exe" --dir artifacts
          test -s artifacts/DiskRecoveryPRO_Setup.exe
          python3 - <<'PY'
          from pathlib import Path
          path = Path("artifacts/DiskRecoveryPRO_Setup.exe")
          with path.open("rb") as f:
              if f.read(2) != b"MZ":
                  raise SystemExit("Release asset is not a Windows PE executable (missing MZ signature).")
          PY
          SHA256="$(sha256sum artifacts/DiskRecoveryPRO_Setup.exe | awk '{print $1}')"
          echo "$SHA256  DiskRecoveryPRO_Setup.exe" > artifacts/DiskRecoveryPRO_Setup.sha256.txt
          echo "$SHA256" > artifacts/sha256.txt
          gh release upload "$TAG" artifacts/DiskRecoveryPRO_Setup.sha256.txt --repo "$REPOSITORY" --clobber

      - name: Remove obsolete legacy update ZIP assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' > release-tags.txt
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
              echo "Retiring obsolete ZIP from release $tag"
              if ! gh release delete-asset "$tag" "DiskRecoveryPRO_Update.zip" --repo "$REPOSITORY" --yes; then
                # Another cleanup worker may have removed it at the same time.
                if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
                  echo "The legacy ZIP is still present on $tag after deletion failed." >&2
                  exit 1
                fi
              fi
            fi
          done < release-tags.txt

      - name: Confirm legacy ZIP is no longer used by the updater
        shell: bash
        run: |
          set -euo pipefail
          echo 'The client update channel now links only to DiskRecoveryPRO_Setup.exe.'
          echo 'Legacy ZIP cleanup is performed by the local publisher to avoid racing this workflow.'

      - name: Update stable manifest to installer EXE
        if: steps.release.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(cat artifacts/sha256.txt)"
          DOWNLOAD_URL="https://github.com/$REPOSITORY/releases/download/$TAG/DiskRecoveryPRO_Setup.exe"
          export DOWNLOAD_URL SHA256
          python3 - <<'PY'
          import json, os
          payload = {
              "version": os.environ["VERSION"],
              "channel": "stable",
              "release_notes": f"Disk Recovery PRO v{os.environ['VERSION']}",
              "downloadUrl": os.environ["DOWNLOAD_URL"],
              "installerUrl": os.environ["DOWNLOAD_URL"],
              "sha256": os.environ["SHA256"],
              "updateMode": "manual-official-release"
          }
          with open("latest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          if gh api "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" > current.json 2>/dev/null; then
            CURRENT_SHA="$(python3 -c "import json; print(json.load(open('current.json', encoding='utf-8'))['sha'])")"
            B64="$(base64 -w0 latest.json)"
            gh api --method PUT "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" \
              -f message="Publish Disk Recovery PRO v$VERSION installer manifest" \
              -f content="$B64" -f sha="$CURRENT_SHA" -f branch="main" >/dev/null
          else
            B64="$(base64 -w0 latest.json)"
            gh api --method PUT "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" \
              -f message="Publish Disk Recovery PRO v$VERSION installer manifest" \
              -f content="$B64" -f branch="main" >/dev/null
          fi
          echo "Published installer manifest for Disk Recovery PRO v$VERSION"
