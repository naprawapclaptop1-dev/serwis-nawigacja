name: Retire flagged Disk Recovery PRO update ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-diskrecoverypro-legacy-zip.yml"
      - "diskrecoverypro-updates/latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire-legacy-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Hide broken v1.9.6 prerelease until Windows installation is verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Existing v1.9.5 client code checks the GitHub releases API before the manifest
          # and does not filter prereleases. Hide the known-broken v1.9.6 candidate so those
          # clients cannot automatically offer its failing installer.
          RELEASE_JSON="$(gh release view v1.9.6 --repo "$REPOSITORY" --json isDraft,isPrerelease 2>/dev/null || true)"
          if [[ -z "$RELEASE_JSON" ]]; then
            echo "v1.9.6 release not found; nothing to hide."
            exit 0
          fi
          IS_DRAFT="$(printf '%s' "$RELEASE_JSON" | gh api --input - /repos/"$REPOSITORY"/releases/tags/v1.9.6 --jq '.draft' 2>/dev/null || true)"
          IS_PRERELEASE="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("isPrerelease", False)).lower())')"
          if [[ "$IS_PRERELEASE" == "true" && "$IS_DRAFT" != "true" ]]; then
            echo "Marking known-broken v1.9.6 release as draft to stop public updater discovery."
            gh release edit v1.9.6 --repo "$REPOSITORY" --draft
          else
            echo "v1.9.6 is already draft or is not a prerelease; no change required."
          fi

      - name: Remove obsolete update archive from every release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' > release-tags.txt
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
              echo "Removing retired DiskRecoveryPRO_Update.zip from release $tag"
              if ! gh release delete-asset "$tag" "DiskRecoveryPRO_Update.zip" --repo "$REPOSITORY" --yes; then
                # A concurrent publisher may already have removed it; only fail if it remains.
                if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
                  echo "Failed to remove legacy archive from $tag" >&2
                  exit 1
                fi
              fi
            fi
          done < release-tags.txt

          # Verify that the retired archive is no longer exposed by any existing release.
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
              echo "Legacy archive remains on release $tag" >&2
              exit 1
            fi
          done < release-tags.txt
          echo "Legacy update ZIP is absent from all inspected releases."
