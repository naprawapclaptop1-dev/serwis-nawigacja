name: Retire flagged Disk Recovery PRO update ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-diskrecoverypro-legacy-zip.yml"
      - "diskrecoverypro-updates/latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire-legacy-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Hide broken v1.9.6 prerelease until Windows installation is verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view v1.9.6 --repo "$REPOSITORY" --json isDraft,isPrerelease 2>/dev/null || true)"
          if [[ -z "$RELEASE_JSON" ]]; then
            echo "v1.9.6 release not found; nothing to hide."
            exit 0
          fi
          IS_DRAFT="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("isDraft", False)).lower())')"
          IS_PRERELEASE="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("isPrerelease", False)).lower())')"
          if [[ "$IS_PRERELEASE" == "true" && "$IS_DRAFT" != "true" ]]; then
            echo "Marking known-broken v1.9.6 release as draft to stop public updater discovery."
            gh release edit v1.9.6 --repo "$REPOSITORY" --draft
          else
            echo "v1.9.6 is already draft or is not a prerelease; no change required."
          fi

      - name: Remove known-broken installer assets from v1.9.6 draft only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view v1.9.6 --repo "$REPOSITORY" --json isDraft,assets 2>/dev/null || true)"
          if [[ -z "$RELEASE_JSON" ]]; then
            echo "v1.9.6 release not found; no assets to retire."
            exit 0
          fi
          IS_DRAFT="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("isDraft", False)).lower())')"
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "Refusing to delete installer assets because v1.9.6 is not a draft." >&2
            exit 1
          fi
          for asset in DiskRecoveryPRO_Setup.exe DiskRecoveryPRO_Setup.sha256.txt; do
            if printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(a.get("name","") for a in d.get("assets",[])))' | grep -Fxq "$asset"; then
              echo "Retiring known-broken draft asset: $asset"
              gh release delete-asset v1.9.6 "$asset" --repo "$REPOSITORY" --yes
            fi
          done
          REMAINING="$(gh release view v1.9.6 --repo "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "$REMAINING" | grep -Eq '^(DiskRecoveryPRO_Setup\.exe|DiskRecoveryPRO_Setup\.sha256\.txt)$'; then
            echo "Broken v1.9.6 installer asset remains after cleanup." >&2
            exit 1
          fi
          echo "Known-broken v1.9.6 assets removed from draft. Release remains unpublished."

      - name: Align the stable GitHub release with latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The manifest is the stable-channel source of truth. Only promote its matching
          # release if the downloadable EXE verifies against the manifest SHA-256.
          MANIFEST_B64="$(gh api "repos/$REPOSITORY/contents/diskrecoverypro-updates/latest.json" --jq '.content')"
          printf '%s' "$MANIFEST_B64" | base64 --decode > latest.json
          CHANNEL="$(python3 -c 'import json; print(json.load(open("latest.json", encoding="utf-8")).get("channel", ""))')"
          VERSION="$(python3 -c 'import json; print(json.load(open("latest.json", encoding="utf-8")).get("version", ""))')"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("latest.json", encoding="utf-8")).get("sha256", ""))')"
          [[ "$CHANNEL" == "stable" ]] || { echo "Manifest channel is not stable; refusing release promotion."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Manifest version format invalid."; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Manifest SHA-256 invalid."; exit 1; }
          TAG="v$VERSION"
          RELEASE_JSON="$(gh api "repos/$REPOSITORY/releases/tags/$TAG")"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          IS_DRAFT="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("draft", False)).lower())')"
          IS_PRERELEASE="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("prerelease", False)).lower())')"
          [[ "$IS_DRAFT" == "false" ]] || { echo "$TAG is a draft; refusing to promote it."; exit 1; }
          ASSETS="$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fxq "DiskRecoveryPRO_Setup.exe"
          printf '%s\n' "$ASSETS" | grep -Fxq "DiskRecoveryPRO_Setup.sha256.txt"
          mkdir -p verified-release
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "DiskRecoveryPRO_Setup.exe" --dir verified-release
          ACTUAL_SHA="$(sha256sum verified-release/DiskRecoveryPRO_Setup.exe | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "Installer SHA-256 does not match the stable manifest; refusing promotion."; exit 1; }
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh api -X PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" -F prerelease=false >/dev/null
            echo "Promoted verified manifest release $TAG to stable."
          else
            echo "$TAG is already stable and matches the manifest checksum."
          fi

      - name: Remove obsolete update archive from every release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' > release-tags.txt
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
              echo "Removing retired DiskRecoveryPRO_Update.zip from release $tag"
              if ! gh release delete-asset "$tag" "DiskRecoveryPRO_Update.zip" --repo "$REPOSITORY" --yes; then
                if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
                  echo "Failed to remove legacy archive from $tag" >&2
                  exit 1
                fi
              fi
            fi
          done < release-tags.txt

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "DiskRecoveryPRO_Update.zip"; then
              echo "Legacy archive remains on release $tag" >&2
              exit 1
            fi
          done < release-tags.txt
          echo "Legacy update ZIP is absent from all inspected releases."
