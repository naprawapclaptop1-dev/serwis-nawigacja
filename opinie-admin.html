<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#081224"><title>Moderacja opinii — Disk Recovery PRO</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--panel:#0e1c31;--line:#213958;--text:#edf5ff;--muted:#a5b9d3;--cyan:#53d6ff;--green:#54e0b1;--orange:#ffbf70}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#173c67 0,transparent 38%),linear-gradient(160deg,#07101f,#08182b 58%,#07101b);color:var(--text);font:15px/1.5 "Segoe UI",Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.panel,.item{background:linear-gradient(150deg,#10233a,#0b1728);border:1px solid var(--line);border-radius:14px;padding:18px;margin:15px 0}h1{font-size:28px}.muted{color:var(--muted)}label{display:block;margin:9px 0 5px}input,select{width:100%;background:#071527;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}button{border:1px solid var(--cyan);border-radius:8px;padding:10px 14px;background:linear-gradient(110deg,var(--cyan),#78f0d1);color:#061523;font-weight:900;cursor:pointer}button.reject{border-color:#a95e55;background:#3a2026;color:#ffe0dc}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.stars{color:#ffc968}.status{margin:10px 0;color:var(--cyan);min-height:1.5em}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}
</style></head><body><main class="wrap"><div class="top"><h1>Moderacja opinii aplikacji</h1><a href="./index.html">← Portal Disk Recovery PRO</a></div><p class="muted">Panel właściciela. Opinie użytkowników trafiają najpierw do kolejki oczekujących. Token administratora jest używany tylko na czas otwartej sesji panelu i znika po wylogowaniu.</p>
<section class="panel"><label for="apiBase">Adres serwera opinii HTTPS</label><input id="apiBase" type="url" placeholder="https://twoj-serwer.example"><label for="adminToken">Token administratora</label><input id="adminToken" type="password" autocomplete="off"><div class="actions" style="margin-top:12px"><button id="connect">POŁĄCZ I POBIERZ OPINIE</button><button id="logout" class="reject" disabled>WYLOGUJ</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section>
<section id="queue" class="hidden"><div class="top"><h2>Wszystkie opinie</h2><button id="refresh">ODŚWIEŻ</button></div><div id="reviewItems"></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let token='';let api='';
function status(t){$('status').textContent=t;}
function itemView(row){const box=document.createElement('article');box.className='item';const head=document.createElement('div');head.className='top';const name=document.createElement('strong');name.textContent=(row.nickname||'Użytkownik')+' · '+(row.createdUtc?new Date(row.createdUtc).toLocaleString('pl-PL'):'');const stars=document.createElement('span');stars.className='stars';stars.textContent='★'.repeat(Math.max(1,Math.min(5,Number(row.rating)||1)));head.append(name,stars);const body=document.createElement('p');body.textContent=row.text||'';const state=document.createElement('p');state.className='muted';state.textContent='Status: '+row.status;box.append(head,body,state);if(row.status!=='approved'&&row.status!=='rejected'){const actions=document.createElement('div');actions.className='actions';for(const [label,decision,cls] of [['ZATWIERDŹ','approved',''],['ODRZUĆ','rejected','reject']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',()=>moderate(row.id,decision,b));actions.append(b);}box.append(actions);}return box;}
async function request(path,body){const options={headers:{Accept:'application/json','X-DRP-Admin-Token':token},cache:'no-store'};if(body!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}const r=await fetch(api+path,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;}
async function refresh(){const list=$('reviewItems');list.replaceChildren();const rows=await request('/api/admin/app-reviews');for(const row of rows)list.append(itemView(row));if(!rows.length){const p=document.createElement('p');p.className='muted';p.textContent='Brak opinii w kolejce.';list.append(p);}status('Pobrano '+rows.length+' opinii.');}
async function moderate(id,decision,button){button.disabled=true;try{await request('/api/admin/app-reviews/'+encodeURIComponent(id)+'/moderate',{status:decision});await refresh();}catch(e){status('Błąd moderacji: '+e.message);button.disabled=false;}}
$('connect').addEventListener('click',async()=>{const candidate=$('apiBase').value.trim().replace(/\/+$/,'');if(!/^https:\/\//i.test(candidate)){status('Podaj prawidłowy adres HTTPS.');return;}if(!$('adminToken').value){status('Wpisz token administratora.');return;}api=candidate;token=$('adminToken').value;$('adminToken').value='';try{await refresh();$('queue').classList.remove('hidden');$('logout').disabled=false;$('connect').disabled=true;}catch(e){token='';api='';status('Nie udało się zalogować: '+e.message);}});
$('refresh').addEventListener('click',()=>refresh().catch(e=>status('Błąd: '+e.message)));
$('logout').addEventListener('click',()=>{token='';api='';$('queue').classList.add('hidden');$('reviewItems').replaceChildren();$('connect').disabled=false;$('logout').disabled=true;status('Wylogowano. Token usunięto z pamięci strony.');});
})();
</script></body></html>
